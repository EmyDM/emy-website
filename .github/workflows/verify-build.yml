name: Verify EMY build
on:
  push:
    branches: [launch-preparation]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit local assets
        run: node scripts/audit-assets.mjs
        continue-on-error: true
      - name: Build website
        run: pnpm build
