name: Deploy EMY preview Worker

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: emy-preview-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: emy-preview
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Cloudflare Worker
        run: pnpm build
      - name: Confirm generated Worker config
        run: |
          test -f dist/server/wrangler.json
          node -e "const c=require('./dist/server/wrangler.json'); if (!c.main) process.exit(1); console.log('Worker entry:',c.main)"
      - name: Deploy preview Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          pnpm exec wrangler deploy --config dist/server/wrangler.json --name emy-preview
