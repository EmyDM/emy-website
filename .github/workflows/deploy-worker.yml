name: Deploy EMY preview Worker

on:
  workflow_dispatch:
  push:
    branches: [launch-preparation]
    paths:
      - '.github/workflows/deploy-worker.yml'

permissions:
  contents: read

concurrency:
  group: emy-preview-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Cloudflare Worker
        run: pnpm build
      - name: Confirm generated Worker config
        run: |
          test -f dist/server/wrangler.json
          node -e "const c=require('./dist/server/wrangler.json'); if (!c.main) process.exit(1); console.log('Worker entry:',c.main)"
      - name: Deploy preview Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          # Inspect only character classes; never print credentials or fragments.
          node <<'NODE'
          const fs = require('fs');
          const token = process.env.CLOUDFLARE_API_TOKEN || '';
          const id = process.env.CLOUDFLARE_ACCOUNT_ID || '';
          const classes = {
            space: (token.match(/ /g) || []).length,
            tab: (token.match(/\t/g) || []).length,
            cr: (token.match(/\r/g) || []).length,
            lf: (token.match(/\n/g) || []).length,
            otherControl: [...token].filter(c => /[\x00-\x08\x0b\x0c\x0e-\x1f\x7f]/.test(c)).length,
            nonAsciiWhitespace: [...token].filter(c => /\s/u.test(c) && !/[ \t\r\n]/.test(c)).length
          };
          for (const [name, count] of Object.entries(classes)) {
            console.log('Token character class ' + name + ': ' + (count ? 'present' : 'absent'));
          }
          // Only structural diagnostics: never log lengths, substrings, hashes or raw secrets.
          const lines = token.split(/\r?\n/);
          console.log('Token structure multiline: ' + (lines.length > 1 ? 'yes' : 'no'));
          console.log('Token structure multiple nonempty lines: ' + (lines.filter(x => x.trim()).length > 1 ? 'yes' : 'no'));
          console.log('Token structure contains spaces inside nonempty lines: ' + (lines.some(x => /\S \S/.test(x)) ? 'yes' : 'no'));
          console.log('Token structure contains Bearer prefix: ' + (/^\s*Bearer\s+/i.test(token) ? 'yes' : 'no'));
          console.log('Token structure resembles copied instructions: ' + (/\b(curl|authorization|create token|copy token|cloudflare api)\b/i.test(token) ? 'yes' : 'no'));
          const cleaned = token.trim();
          const innerWhitespace = /\s/u.test(cleaned);
          if (innerWhitespace || /[\x00-\x1f\x7f]/.test(cleaned)) {
            console.error('::error::Token contains whitespace/control characters after trimming; inspect GitHub secret. No token characters were logged.');
            process.exit(1);
          }
          if (!/^[a-fA-F0-9]{32}$/.test(id.trim())) {
            console.error('::error::Cloudflare Account ID is not 32 hexadecimal characters.');
            process.exit(1);
          }
          fs.appendFileSync(process.env.GITHUB_ENV, 'CLOUDFLARE_API_TOKEN=' + cleaned + '\nCLOUDFLARE_ACCOUNT_ID=' + id.trim() + '\n', {mode: 0o600});
          NODE
          pnpm exec wrangler deploy --config dist/server/wrangler.json --name emy-preview
